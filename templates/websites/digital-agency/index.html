        (function() {
          const colorTheme = localStorage.getItem('hs-clipboard-theme') || 'default';
          const themeClassesMap = {
            "default": ["bg-blue-600", "dark:bg-blue-500"],
            "harvest": ["bg-amber-700", "dark:bg-amber-300"],
            "retro": ["bg-fuchsia-500"],
            "ocean": ["bg-cyan-600", "dark:bg-cyan-500"],
            "autumn": ["bg-amber-500", "dark:bg-amber-200"],
            "moon": ["bg-stone-800", "dark:bg-neutral-900"],

          const allThemeClasses = [...new Set(Object.values(themeClassesMap).flat())];
          const themeToggleColor = document.getElementById("template-preview-theme-controls-color");

          themeToggleColor.classList.remove(...allThemeClasses);

  <!-- Required plugins -->

  <script src="https://preline.co/assets/js/hs-copy-clipboard-helper.js"></script>

  <script>
    (function () {
      const shell = document.getElementById("template-preview-shell");
      const frame = document.getElementById("template-preview-iframe");
      const frameShell = document.getElementById("template-preview-frame-shell");
      const openNewTabButton = document.getElementById(
        "template-preview-open-new-tab",
      );
      const themeSelect = document.getElementById("hs-themes");
      const brandSelect = document.getElementById("hs-brands");
      const fontSelect = document.getElementById("hs-fonts");
      const sizeToggles = document.querySelectorAll(
        ".template-preview-size-toggle",
      );
      const colorModeButtons = document.querySelectorAll(
        "[data-preview-color-mode]",
      );
      const darkModeButton = document.getElementById(
        "template-preview-dark-toggle",
      );
      const lightModeButton = document.getElementById(
        "template-preview-light-toggle",
      );
      const themeToggleColor = document.getElementById(
        "template-preview-theme-controls-color",
      );
      const allowedPathPrefix = frame.dataset.previewAllowedPrefix || "";
      const shouldHideAccessCta =
        document.body?.dataset.previewHideAccessCta === "true";
      const indexFrameSrc = frame.getAttribute("src") || "";

      if (!shell || !frame || !frameShell) return;

      const themeInputs = shell.querySelectorAll(
        '[data-template-preview-theme-list] input[type="radio"]',
      );
      const brandInputs = shell.querySelectorAll(
        '[data-template-preview-brand-list] input[type="radio"]',
      );
      const themeClassesMap = {
        default: ["bg-blue-600", "dark:bg-blue-500"],
        harvest: ["bg-amber-700", "dark:bg-amber-300"],
        retro: ["bg-fuchsia-500"],
        ocean: ["bg-cyan-600", "dark:bg-cyan-500"],
        autumn: ["bg-amber-500", "dark:bg-amber-200"],
        moon: ["bg-stone-800", "dark:bg-neutral-900"],
        bubblegum: ["bg-pink-600", "dark:bg-pink-500"],
        cashmere: ["bg-preline-mauve-500"],
        olive: ["bg-preline-avocado-500"],
      };
      const allThemeClasses = [...new Set(Object.values(themeClassesMap).flat())];
      const themeDefaults = {
        default: "blue",
        harvest: "amber",
        retro: "fuchsia",
        ocean: "cyan",
        autumn: "yellow",
        moon: "stone",
        bubblegum: "pink",
        cashmere: "preline-mauve",
        olive: "preline-avocado",
      };
      const state = {
        theme: localStorage.getItem("hs-clipboard-theme") || "default",
        brand: localStorage.getItem("hs-clipboard-brand") || "blue",
        font: localStorage.getItem("hs-clipboard-font") || "sans",
        colorMode:
          localStorage.getItem("hs-preview-color-mode") ||
          localStorage.getItem("hs_theme") ||
          "light",
        viewport: "desktop",
      };
      const viewports = {
        mobile: { shell: ["max-w-[430px]"], height: "100%" },
        desktop: { shell: ["max-w-full"], height: "100%" },
      };
      const pageParam = new URLSearchParams(window.location.search).get("page");

      const syncSelectValue = (select, value, silent = false) => {
        if (!select) return;

        const option = Array.from(select.options).find(
          (item) => item.value === value,
        );

        if (!option) return;

        select.value = value;

        if (!silent) select.dispatchEvent(new Event("change", { bubbles: true }));
      };
      const syncRadioValue = (inputs, value, silent = false) => {
        if (!inputs?.length) return;

        const input = Array.from(inputs).find((item) => item.value === value);

        if (!input) return;

        input.checked = true;

        if (!silent) input.dispatchEvent(new Event("change", { bubbles: true }));
      };
      const normalizePathSegments = (pathname) => {
        const normalizedPath = pathname.endsWith("/") ? pathname : `${pathname}/`;

        return normalizedPath.split("/").filter(Boolean);
      };
      const hasPathPrefixSequence = (pathname, prefix) => {
        const pathnameSegments = normalizePathSegments(pathname);
        const prefixSegments = normalizePathSegments(prefix);

        if (!prefixSegments.length) return true;
        if (prefixSegments.length > pathnameSegments.length) return false;

        for (
          let i = 0;
          i <= pathnameSegments.length - prefixSegments.length;
          i += 1
        ) {
          const isMatch = prefixSegments.every(
            (segment, index) => pathnameSegments[i + index] === segment,
          );

          if (isMatch) return true;
        }

        return false;
      };
      const shouldKeepShell = (href) => {
        if (!href) return true;

        try {
          const url = new URL(href, window.location.href);

          if (url.protocol !== "http:" && url.protocol !== "https:") return true;

          if (!allowedPathPrefix) return true;

          return hasPathPrefixSequence(url.pathname, allowedPathPrefix);
        } catch {
          return true;
        }
      };
      const persistState = (iframeStorage) => {
        const sharedEntries = [
          ["hs-clipboard-theme", state.theme],
          ["hs-clipboard-brand", state.brand],
          ["hs-clipboard-font", state.font],
        ];

        sharedEntries.forEach(([key, value]) => {
          localStorage.setItem(key, value);
          iframeStorage.setItem(key, value);
        });
        localStorage.setItem("hs-preview-color-mode", state.colorMode);
        iframeStorage.setItem("hs_theme", state.colorMode);
      };
      const dispatchPreviewEvent = (iframeWindow, eventName, value) => {
        const target = iframeWindow?.document?.documentElement;

        if (!iframeWindow || !target) return;

        iframeWindow.dispatchEvent(
          new CustomEvent(eventName, {
            detail: {
              target,
              value,
            },
          }),
        );
      };
      const applyPreviewState = ({ dispatchEvents = [] } = {}) => {
        const iframeWindow = frame.contentWindow;
        const iframeHtml = iframeWindow?.document?.documentElement;

        if (!iframeHtml) return;

        persistState(iframeWindow.localStorage);

        iframeHtml.setAttribute("data-theme", `theme-${state.theme}`);
        iframeHtml.setAttribute("data-brand", state.brand);
        iframeHtml.setAttribute("data-font", state.font);
        iframeHtml.classList.toggle("dark", state.colorMode === "dark");
        iframeHtml.classList.toggle("light", state.colorMode !== "dark");

        iframeWindow.generateVariables?.(state.theme, state.brand);
        iframeWindow.HSStaticMethods?.autoInit?.();

        dispatchEvents.forEach((eventName) => {
          if (eventName === "on-hs-color-theme-change") {
            dispatchPreviewEvent(iframeWindow, eventName, state.theme);

            return;
          }

          if (eventName === "on-hs-brand-change") {
            dispatchPreviewEvent(iframeWindow, eventName, state.brand);

            return;
          }

          if (eventName === "on-hs-font-change") {
            dispatchPreviewEvent(iframeWindow, eventName, state.font);
          }
        });
      };
      const hideIframeAccessCta = () => {
        if (!shouldHideAccessCta) return;

        frame.contentWindow?.document
          ?.getElementById("preview-get-access-cta")
          ?.remove();
      };
      const toggleButton = (btn, show) => {
        btn?.classList.toggle("hidden", !show);
        btn?.classList.toggle("flex", show);
      };
      const syncColorModeButtons = () => {
        const isDark = state.colorMode === "dark";

        toggleButton(darkModeButton, !isDark);
        toggleButton(lightModeButton, isDark);
        colorModeButtons.forEach((btn) => {
          btn.setAttribute(
            "aria-pressed",
            String(btn.dataset.previewColorMode === state.colorMode),
          );
        });
      };
      const syncViewportButtons = (activeViewport) => {
        sizeToggles.forEach((button) => {
          const isActive = button.dataset.previewSize === activeViewport;
          button.dataset.active = String(isActive);

          button.setAttribute("aria-pressed", String(isActive));
          button.classList.toggle("hs-preview-size-active", isActive);
        });
      };
      const getIframeRelativePath = (href) => {
        try {
          const pathname = new URL(href, window.location.href).pathname;
          const prefix = allowedPathPrefix.endsWith("/")
            ? allowedPathPrefix
            : `${allowedPathPrefix}/`;

          return pathname.startsWith(prefix)
            ? pathname.slice(prefix.length)
            : null;
        } catch {
          return null;
        }
      };
      const syncUrlToIframe = (href) => {
        const relPath = getIframeRelativePath(href);

        if (relPath === null) return;

        const newUrl = new URL(window.location.href);
        const indexRelPath = getIframeRelativePath(indexFrameSrc);

        if (!relPath || relPath === indexRelPath) {
          newUrl.searchParams.delete("page");
        } else {
          newUrl.searchParams.set("page", relPath);
        }

        history.replaceState(null, "", newUrl.toString());
      };
      const setViewport = (viewport) => {
        if (viewport === "horizontal") {
          shell.classList.add("hidden");

          return;
        }

        state.viewport = viewport;

        syncViewportButtons(viewport);
        frameShell.classList.remove(
          "max-w-[430px]",
          "max-w-full",
          "max-w-[900px]",
        );
        frameShell.classList.add(...viewports[viewport].shell);

        frame.style.height = viewports[viewport].height;
      };

      if (pageParam && allowedPathPrefix) {
        const prefix = allowedPathPrefix.endsWith("/")
          ? allowedPathPrefix
          : `${allowedPathPrefix}/`;
        const resolvedPath = prefix + pageParam.replace(/^\//, "");

        if (hasPathPrefixSequence(resolvedPath, allowedPathPrefix)) {
          frame.src = resolvedPath;
        }
      }

      if (state.brand === "default" || state.brand === "undefined") {
        state.brand = themeDefaults[state.theme] || "blue";
      }

      [
        [themeSelect, state.theme],
        [brandSelect, state.brand],
        [fontSelect, state.font],
      ].forEach(([select, value]) => syncSelectValue(select, value, true));
      [
        [themeInputs, state.theme],
        [brandInputs, state.brand],
      ].forEach(([inputs, value]) => syncRadioValue(inputs, value, true));
      syncColorModeButtons();
      setViewport(state.viewport);

      themeSelect?.addEventListener("change", (evt) => {
        state.theme = evt.target.value;
        state.brand = themeDefaults[state.theme] || state.brand;

        syncRadioValue(themeInputs, state.theme, true);
        syncRadioValue(brandInputs, state.brand, true);

        const brandInstance = HSSelect.getInstance(brandSelect, true);

        brandInstance?.element?.setValue(state.brand);

        applyPreviewState({
          dispatchEvents: ["on-hs-color-theme-change", "on-hs-brand-change"],
        });
      });

      brandSelect?.addEventListener("change", (evt) => {
        state.brand = evt.target.value;

        syncRadioValue(brandInputs, state.brand, true);
        applyPreviewState({
          dispatchEvents: ["on-hs-brand-change"],
        });
      });

      themeInputs.forEach((input) => {
        input.addEventListener("change", (evt) => {
          if (!evt.target.checked) return;

          state.theme = evt.target.value;
          state.brand = themeDefaults[state.theme] || state.brand;

          themeToggleColor.classList.remove(...allThemeClasses);
          themeToggleColor.classList.add(...themeClassesMap[state.theme]);

          syncSelectValue(themeSelect, state.theme, true);
          syncSelectValue(brandSelect, state.brand, true);
          syncRadioValue(brandInputs, state.brand, true);
          applyPreviewState({
            dispatchEvents: ["on-hs-color-theme-change", "on-hs-brand-change"],
          });
        });
      });

      brandInputs.forEach((input) => {
        input.addEventListener("change", (evt) => {
          if (!evt.target.checked) return;

          state.brand = evt.target.value;

          syncSelectValue(brandSelect, state.brand, true);
          applyPreviewState({
            dispatchEvents: ["on-hs-brand-change"],
          });
        });
      });

      fontSelect?.addEventListener("change", (evt) => {
        state.font = evt.target.value;

        applyPreviewState({
          dispatchEvents: ["on-hs-font-change"],
        });
      });

      colorModeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.colorMode = button.dataset.previewColorMode || "light";

          syncColorModeButtons();
          applyPreviewState();
        });
      });

      sizeToggles.forEach((button) => {
        button.addEventListener("click", () =>
          setViewport(button.dataset.previewSize),
        );
      });

      openNewTabButton?.addEventListener("click", () => {
        const src = frame.getAttribute("src") || frame.src;

        if (src) window.open(src, "_blank");
      });

      frame.addEventListener("load", () => {
        const frameHref =
          frame.contentWindow?.location?.href ||
          frame.getAttribute("src") ||
          frame.src;

        if (!shouldKeepShell(frameHref)) {
          window.location.href = frameHref;

          return;
        }

        syncUrlToIframe(frameHref);
        syncColorModeButtons();
        hideIframeAccessCta();
        applyPreviewState();
      });
    })();
  </script>

  <!-- Apexcharts -->
  <script>
    (function () {
      const html = document.documentElement;
      const appearance = localStorage.getItem("hs_theme") || "default";
      const resolvedAppearance = appearance === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default")
        : appearance;
      const colorTheme = localStorage.getItem("hs-clipboard-theme") || "default";
      const brand = localStorage.getItem("hs-clipboard-brand");
      const font = localStorage.getItem("hs-clipboard-font");

      html.classList.toggle("dark", resolvedAppearance === "dark");
      html.setAttribute("data-theme", `theme-${colorTheme}`);
      if (brand) html.setAttribute("data-brand", brand);
      if (font) html.setAttribute("data-font", font);
    })();
  </script>

  <!-- Color Theme Change -->
  <script>
    window.addEventListener("load", () => {
      const EVENT_NAME = "on-hs-color-theme-change";
      const SYNC_FLAG = "__hsThemeSynced";

      const getTarget = (selector) => {
        if (!selector) return null;

        let target = document.querySelector(selector) || null;
        if (target && target.querySelector("iframe")) {
          target = target.querySelector("iframe").contentWindow.document.documentElement;
        }

        return target;
      };

      window.addEventListener(EVENT_NAME, (evt) => {
        const detail = evt?.detail || {};
        const sourceTarget = detail.target || null;
        const theme = detail.theme;

        if (!theme || detail[SYNC_FLAG]) return;

        const controls = document.querySelectorAll("[data-hs-component-color-theme]");
        const syncedTargets = new Set();

        controls.forEach((control) => {
          const selector = control.dataset.hsComponentColorTheme;
          const target = getTarget(selector);

          if (!target || target === sourceTarget || syncedTargets.has(target)) return;
          syncedTargets.add(target);

          target.setAttribute("data-theme", `theme-${theme}`);

          const targetWindow = target.ownerDocument?.defaultView || window;
          targetWindow.dispatchEvent(
            new CustomEvent(EVENT_NAME, {
              detail: {
                ...detail,
                [SYNC_FLAG]: true,
                target,
              },
            }),
          );
        });
      });
    });
  </script>
